name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check --show-fixes
      - run: uv run ruff format --check
      - run: uv run ty check dbt_preflight/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest --cov=dbt_preflight --cov-report=term-missing

  # The action, run on its own example project, so a change to action.yml is exercised
  # by the same pull request that makes it.
  self-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          config: examples/webshop/.dbt-preflight.yml
          post-comment: ${{ github.event_name == 'pull_request' }}
