# Ship a release when a drafted GitHub release is published.
#
# The process, the same as model2data and model2data studio:
#   1. Bump `version` in pyproject.toml and date the CHANGELOG section, on a pull request.
#   2. After it merges, draft the release: tag vX.Y.Z on main, title vX.Y.Z, and the
#      CHANGELOG section as the notes (`scripts/draft_release.sh` does exactly this).
#   3. Read the draft, then press "Publish release". Nothing ships before that.
#
# Publishing creates the tag and runs this workflow: it checks the tag matches
# pyproject.toml, builds the wheel and sdist, runs the tests against the built wheel,
# attaches both files to the release, publishes to PyPI, and moves the `v0` tag so
# `uses: JB-Analytica/dbt-preflight@v0` tracks the latest 0.x release.
#
# PyPI publishing uses the trusted publisher configured on pypi.org for this repository and
# this workflow file, and is gated on the repository variable PYPI_PUBLISH=true.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Check the tag matches pyproject.toml
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "$TAG" ] || { echo "tag $TAG != pyproject version $version"; exit 1; }
      - run: uv build
      - name: Test the built wheel
        run: |
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl pytest
          /tmp/wheel-venv/bin/dbt-preflight --version
          /tmp/wheel-venv/bin/python -m pytest -q tests/test_report.py tests/test_config.py tests/test_conventions.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the built files to the published release
        run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Move the major tag
        run: |
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$TAG"
          git push -f origin "$major"

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
